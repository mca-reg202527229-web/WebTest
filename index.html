<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beautiful Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      overflow:hidden;
    }

    .background{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:0;
    }

    .circle{
      position:absolute;
      border-radius:50%;
      background: rgba(255,255,255,0.1);
      animation: float 10s infinite ease-in-out;
    }

    .circle:nth-child(1){
      width:200px;
      height:200px;
      top:10%;
      left:10%;
    }

    .circle:nth-child(2){
      width:300px;
      height:300px;
      bottom:10%;
      right:10%;
      animation-duration:14s;
    }

    .circle:nth-child(3){
      width:150px;
      height:150px;
      bottom:30%;
      left:25%;
      animation-duration:12s;
    }

    @keyframes float{
      0%,100%{
        transform: translateY(0px);
      }
      50%{
        transform: translateY(-20px);
      }
    }

    .login-container{
      position:relative;
      z-index:1;
      width:350px;
      padding:40px;
      border-radius:20px;
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.2);
      box-shadow:0 8px 32px rgba(0,0,0,0.2);
      color:white;
    }

    .login-container h2{
      text-align:center;
      margin-bottom:30px;
      font-size:32px;
      letter-spacing:1px;
    }

    .input-box{
      position:relative;
      margin-bottom:25px;
    }

    .input-box input{
      width:100%;
      padding:14px 15px;
      border:none;
      outline:none;
      border-radius:10px;
      background: rgba(255,255,255,0.15);
      color:white;
      font-size:16px;
    }

    .input-box input::placeholder{
      color: rgba(255,255,255,0.7);
    }

    .remember{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
      margin-bottom:20px;
    }

    .remember a{
      color:#fff;
      text-decoration:none;
    }

    .remember a:hover{
      text-decoration:underline;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:white;
      color:#764ba2;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
      background:#f1f1f1;
    }

    .register{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }

    .register a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    .register a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

  <div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="login-container">
    <h2>Welcome Back</h2>

    <form>
      <div class="input-box">
        <input type="email" placeholder="Email Address" required>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Password" required>
      </div>

      <div class="remember">
        <label>
          <input type="checkbox"> Remember me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="btn">Login</button>

      <div class="register">
        Don't have an account?
        <a href="#">Register</a>
      </div>
    </form>
  </div>

</body>
</html>
